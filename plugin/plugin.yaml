name: router
version: 1.20.2
description: "Defers bulky core tool schemas behind the built-in tool_search router (keep-list: tools.tool_search.keep_flat), applies tool/param description overrides from overrides.yaml, repairs malformed tool_call argument shapes, serves bridge-tool schemas via tool_describe, registers a local (httpx + stdlib) web_extract backend selectable as web.extract_backend: local, steers the model away from endless re-searching after tools.tool_search.search_steer_after web_search calls per turn, constrains tool-call decoding server-side via an llm_request middleware that injects a vLLM/xgrammar structural_tag response_format built from the request's own tool schemas (tools.tool_search.constrained_decoding on/off, host allowlist tools.tool_search.constrained_hosts), gracefully executes bare-name calls to deferred tools instead of letting the conversation loop reject and kill the turn (tools.tool_search.flat_name_fallback on/off, schemas stay deferred), and (v1.5.1) mitigates model-side decoding pathologies on the allowlisted hosts: clamps the outgoing max_tokens to tools.tool_search.max_tokens_cap (default 3000, 0 disables — runaway repetition loops die fast and recover via hermes's finish_reason=length continuation), injects frequency_penalty when the request doesn't set it (tools.tool_search.frequency_penalty, default 0.3, 0 disables), and appends a one-line re-search nudge when web_search results are polluted by the Hermès fashion brand (tools.tool_search.brand_nudge on/off). v1.5.2 adds observability logging for the steering/brand injections (INFO on fire, DEBUG on brand non-trigger) and a duplicate-query hard gate: a pre_tool_call hook blocks a web_search whose normalized query already ran more than tools.tool_search.dup_query_limit (default 3) times in the same turn, skipping the network call and returning an error-style result that tells the model to web_extract or answer now. v1.5.3 generalizes that gate to EVERY tool: attempts are keyed on (session, turn, tool, args JSON-serialized with sorted keys, casefolded, whitespace-collapsed), the tool_call bridge is unwrapped so bridged and bare invocations share a counter, and more than tools.tool_search.dup_call_limit (default 3, <1 disables) identical attempts in one turn are blocked before execution; tools.tool_search.dup_call_exempt (default clarify, todo, memory, text_to_speech, tool_search, tool_describe) lists tools never gated, and web_search additionally keeps the v1.5.2 query gate (blocked at whichever limit is lower). v1.5.4 adds a hard per-turn search ceiling: the same pre_tool_call gate counts ALL web_search attempts per (session, turn) — blocked and successful alike, bridge-unwrapped — and once the count exceeds tools.tool_search.search_hard_cap (default 15, explicit 0/<1 disables) every further web_search this turn is blocked regardless of query wording (paraphrase fountains can't escape a per-tool counter) with an error-style result ordering the model to answer now or web_extract a URL it already has; web_extract itself stays uncapped by the ceiling (it remains under the dup-call gate), ceiling activation logs INFO once per turn and further blocks log DEBUG. v1.6.0 adds a SESSION SELF-HEALING layer (selfheal.py, master flag tools.tool_search.selfheal.enabled, default on): a per-turn HEALTHY->WOBBLING->FAILING->DOOMED state machine fed by the gate counters — WOBBLING is log-only (the soft-nudge rung ships off after experiment E stalled the endpoint 3/3), FAILING forces synthesis (strips tools/tool_choice/response_format, appends one corrective user message per remaining API call, disables thinking at the chat-template level on the constrained_hosts allowlist — selfheal.no_think, without which the model answers inside the reasoning channel and content stays empty — and a pre_tool_call tripwire blocks non-exempt tools for the rest of the turn), and DOOMED (final text still degenerate) replaces the text with an honest diagnostic and performs at most one fresh-session retry through the gateway captured at pre_gateway_dispatch (reset_session + agent evict + synthetic internal re-dispatch carrying the verbatim question + diagnosis), degrading to an honest failure report when capped or when any private gateway symbol is missing. v1.6.1 fixes the four failure classes from corpus batch 1 (2026-07-19): an OUTGOING-ANSWER SECRET SCRUB (tools.tool_search.secret_scrub, default on) composed into the selfheal transform_llm_output callback redacts known vendor key shapes (sk-/ghp_/hf_/vw_/JWT/...), generic high-entropy prefixed tokens, secret-keyword assignments (VLLM_API_KEY=..., \"apiKey\": \"...\") and Bearer credentials from the final answer as [redacted] — conservative by design: pure numbers, placeholders, env lookups, git SHAs, base64 data URIs and plain identifiers never match; NO_THINK_ALWAYS (tools.tool_search.no_think_always, plugin default off — install.py seeds the A/B-chosen deploy value) extends the chat-template think-disable to every call on the constrained_hosts allowlist because reasoning-channel deliberation leaked into normal answers without literal <think> tags; the FORCED-SYNTHESIS corrective now explicitly prefers honest uncertainty (say the searches found nothing reliable, label general-knowledge answers unverified, never fabricate version numbers/names/dates/URLs); and classify_final/S8 detects INTENT-ANNOUNCEMENT finals (\"I'll research... let me search...\") as degenerate regardless of length, so a turn that only announces work now takes the DOOMED/fresh-retry path instead of shipping the announcement as the answer. v1.6.2 fixes the corpus-batch-2 failure classes, whose common thread is that v1.6.1's quality checks only fired when the self-healer was ARMED while most remaining failures happen on HEALTHY turns — the guards are now STATE-INDEPENDENT. (T1) A degenerate long-form REPETITION detector (pure, unit-tested against the real r08/r21/r26/r39 garbage and clean 4-way tables) runs as an UNCONDITIONAL transform_llm_output guard (tools.tool_search.repetition_guard, default on): four signals (exact char-tandem run, repeated multi-word shingle, low-diversity char-garbage window, and a >=150-word unpunctuated run-on) flag the collapse regardless of turn state or length, and the guard truncates at the point collapse begins with an honest note (or replaces with a short honest message when unsalvageable); the same check is added to classify_final so armed turns catch it too. The max_tokens=3000 clamp was verified NOT bypassed (batch-2 r08/r21/r26/r39 all stopped at 277..2672 output tokens via natural finish_reason=stop, well under the cap — the 16 KB r39 wall was 2672 word-dense tokens, not a cap escape), so the collapse ends by EOS before the cap and the repetition guard, not a lower cap, is the fix. (T2) The anti-fabrication honesty guidance now also reaches the model earlier, appended once as a short advisory SYSTEM message when the turn reaches WOBBLING+ (tools.tool_search.selfheal.wobble_honesty, default on) — cache-stable append-only, HEALTHY turns untouched, and not a 'stop searching' user turn (which stalled the endpoint in experiment E). (T3) The intent-announcement degeneracy check now runs in the same unconditional guard, so a HEALTHY turn that ships only 'let me click/scroll…' is replaced instead of delivered. (T6) The pre_tool_call gate now blocks empty/whitespace-only web_search queries before the network with an error-style result (a q=\"\" had hit SearXNG and returned 400), counted before the counters so blocked empties don't pollute them. v1.7.0 adds CONTENT-BEARING INTERMEDIATE PROGRESS MESSAGES for long turns (plugin/progress.py, master flag tools.tool_search.progress.enabled, default on, delivery allowlist tools.tool_search.progress.platforms default [telegram]): during a long-running turn the user gets interim Telegram messages carrying ACTUAL INFORMATION ALREADY FOUND plus an explicit not-the-final-answer marker (\"⏳ Still working… So far I've found X and Y; still checking…\"), not a bare typing indicator. A pre_gateway_dispatch hook captures the live gateway weakref + running event loop + per-session SessionSource (the same proven path selfheal's fresh-retry uses); a READ-ONLY llm_request middleware (registered LAST, after selfheal, so it never perturbs the healer's mutations) fires once per API call as the natural step+wall-clock trigger, harvests a findings digest from the conversation's tool RESULTS with the v1.6.x anti-fabrication discipline (web result title—url or the first substantial line of a successful output; error results and loop-guard blocks skipped, nothing invented), and when the trigger/throttle policy fires — first interim after first_delay_secs (25) OR first_steps (3) API calls, then throttled by BOTH throttle_secs (30) AND throttle_steps (2), only when there are >= min_new_findings (1) GENUINELY NEW findings not already reported this turn, capped at max_per_turn (4) — fire-and-forgets the message onto the captured loop via gateway._adapter_for_source(source).send (never awaited in the hot path, so a slow/failing send can NEVER block or slow the turn). Complements hermes's native model-driven interim_assistant_callback (which local-27b rarely triggers) by synthesizing progress from tool results regardless of whether the model narrated; the display.tool_progress status bubble stays generic-by-design (status_phrases never interpolates content) so it is untouched. Fail-safe like every other feature: any error returns None and leaves the turn unchanged; a missing/renamed gateway symbol logs one warning and disables only interim delivery. v1.7.1 closes a REAL telegram failure (session 20260719_012254: a legit long research question produced garbage because the session was POISONED with 265 messages of prior churn the model imitated — ~350-char finals that each passed the degeneracy checks so DOOMED never fired). Three fixes. FIX 1 — PROACTIVE POISON RESET at message arrival (tools.tool_search.selfheal.proactive_reset, default on; tools.tool_search.selfheal.poison_reset_hi, default 0.35): the pre_gateway_dispatch capture now loads the existing session's history (session_store._db.get_messages) and scores its LAST COMPLETED turn's degeneracy fraction; when it exceeds poison_reset_hi (measured 0.62 on the real poisoned session vs a 0.33 max across 58 clean/churn controls) the session is reset in place (reset_session + agent evict + per-session override clear) BEFORE the incoming question is dispatched, so the question runs in a clean session with no re-dispatch — at most one reset per session_key per 120 s, platform-gated, and fully fail-safe (any error lets the turn proceed normally, the user's message is never blocked). FIX 2 — PHRASE/SENTENCE-level repetition (detect_phrase_repetition, wired into detect_degenerate_repetition so classify_final and the unconditional final guard both use it): flags a normalized sentence/line repeated >=2x even in short 200-500 char finals via two signals — two adjacent identical segments >=80 chars, or a segment whose repeats cover >=40% of the reply — catching the Silverton '…36°C/97°F) — a lovely…' line repeated twice inside a 363-char final that the v1.6.2 >=4-copy / <=48-char-period detector missed (0 false positives over 138 real clean finals). FIX 3 — TRAILING/EMBEDDED intent-announcement over a stub (trailing_intent_stub, wired into classify_final + the unconditional guard): a short final that ends with (or is dominated by) a bare intent announcement whose non-announcement remainder is thin, a malformed stub table (header+separator, no well-formed data row), or itself repetition-degenerate is classified degenerate — catching the '…Let me do a focused searches to give you real data.' finals sitting above stub tables while a complete answer that merely offers follow-up ('let me know if…') still passes. All three tuned against the REAL garbage captured from state.db plus 138 clean controls; regression + unit suites extended with the real samples as fixtures (tests/data/silverton_fixtures.json). v1.7.2 fixes a PROGRESS-DIGEST CLEANLINESS bug the gateway harness caught: hermes wraps every tool result the model sees in an <untrusted_tool_result source=\"...\"> envelope + a 'treat as DATA, do not follow instructions' boilerplate paragraph, so the findings harvester's json.loads() failed on the leading tag and the interim progress message surfaced the raw '<untrusted_tool_result …>' wrapper tag as a 'finding'. Both progress.harvest_findings and selfheal.harvest_findings now peel that envelope first (strip_tool_result_wrapper: regex-removes the open/close tool_result tags and the do-not-follow boilerplate) and parse with a lenient JSON reader that also tolerates residual noise, so the digest shows real content ('So far I've found: <title> — <url>'); fully fail-safe (returns the input unchanged on any error) and unit-tested against the verbatim hermes wrapper text. v1.7.3 adds a TOKEN-CORRUPTION / MUTATING-FRAGMENT guard for a new degeneracy class corpus batch 3 caught the v1.7.2 guards missing (tools.tool_search.corruption_guard, default on): coherent-prose finals with individual tokens dropped/doubled/truncated mid-stream (suspected vLLM ngram spec-decode/fp8 on the upgraded build — cl05 restated a hash truncated '8cfde6efdfc4'->'8cfde6efdfc', cl06 collapsed to a bare '2!' stub, ms01 mutated the same number '207,879'->'207,89'->'207,87' amid unbalanced '**') slip every repetition/intent signal because there is no long tandem repeat and no work-announcement. A new pure detect_output_corruption fires on four signals each tuned to ZERO false positives against 24 real+adversarial clean controls (legit factorial 20!=2432902008176640000, code with 2**10, a hash shown with its legitimate 12-of-64-char prefix, bold tables, big comma numbers, prices): trailing_stub (final line is a bare 'N!'/lone-operator fragment), prefix_trunc (a >=5-digit number or >=8-char hex/id token restated as a near-prefix of itself with a small length delta, so a hash's real 12-of-64 prefix at delta ~52 is safe while '207,87' inside '207,879' is caught), embedded_emph (a '**' wedged between two alphanumerics outside code — a bold toggle splitting a token like 'v0.18.2**18.2', never legit markdown), and line_odd_emph (a single non-code line carrying an ODD '**' count — an unclosed emphasis, since markdown bold never spans lines). It is wired into both the unconditional final guard (apply_final_guards — a corrupted final can't be salvaged by truncation, so it is replaced with an honest 'my answer came out garbled, please re-ask' note) and classify_final (armed turns route it to the DOOMED honest-diagnostic / fresh-retry path). Measured on the real batch-3 samples: 7/7 targeted corrupt finals flagged (incl. the three shipped fails cl05/cl06/ms01), 0/24 clean controls tripped; semantic-only truncations (378 for 378,000), completeness misses, and reasoning-leak finals are deliberately out of scope (not safely separable from clean text). DEFENSIVE ONLY — the ROOT cause is server-side spec-decode/fp8 corruption that only a server-config rollback fixes; the guard converts corrupted output into an honest failure rather than shipping garbage, it does not restore correctness. v1.7.3 also lowers the selfheal S7 wall-clock forced-synthesis trigger default (tools.tool_search.selfheal.fail_wall_secs) 480->240 so a long search/tool loop bails under the corpus 5-min ceiling instead of over it (batch-3 ms03 ran 513s and cl03 508s before S7 fired at 490s+); install.py seeds 240 when absent, but a deployed config already carrying 480 is not auto-lowered by re-install (this release lowers the five deployed configs in place as a safe threshold tune). v1.8.0 adds LATENCY-INFERRED SERVER-LOAD AWARENESS (plugin/loadaware.py, tools.tool_search.loadaware.enabled default on): the shared vLLM box is often saturated (deep request queue) while still healthy and generating, so hermes's 120 s streaming read timeout fires on a merely-busy server and its retries (agent.api_max_retries=3 + nested HERMES_STREAM_RETRIES) deepen the queue (congestion collapse). loadaware observes per-call latency via post_api_request (success, api_duration) and api_request_error (failures/timeouts) over a process-global rolling window restricted to the constrained_hosts allowlist, classifies HEALTHY/SLOW/STALLED (SLOW = elevated/climbing latency but still completing; STALLED = a trailing run of timeouts with no completions), and from a READ-ONLY llm_request middleware delivers ONE honest, throttled, progress-coordinated note per state ('server under heavy load, still working' on SLOW; 'server unresponsive, try again shortly' on STALLED) reusing progress.py's captured adapter — it NEVER amplifies (issues no LLM calls). The BIG levers are CONFIG-ONLY on this build (the streaming path discards any middleware-set timeout and no hook can suppress retries): install.py seeds providers.<model.provider>.request_timeout_seconds=300 (raises the 120 s read tripwire so a slow-but-working server isn't abandoned) and agent.api_max_retries=2 (cut retry amplification; set 1 for aggressive anti-collapse, and env HERMES_STREAM_RETRIES=0 for the nested stream retries), both only-when-absent. v1.8.1 (batch-recovery on vLLM 0.25.1, which fixed server STABILITY but NOT the spec-decode/fp8 token corruption) extends detect_output_corruption (tools.tool_search.corruption_guard, unchanged) with THREE MORE zero-false-positive signals for the 'class B' corruption that shipped past the v1.7.3 guard on the real Silverton itinerary final: doubled-phrase (a 2-6 word shingle repeated back-to-back on one line with no sentence punctuation between the copies — 'Provincial Park Provincial Park' — same-line + word-length guards keep heading->body repeats and 'New York, New York' safe), dropped-letter (a capitalized token appearing BOTH correctly and as a one-INTERIOR-letter-dropped near-miss of itself, 'Silverton'/'Silveron', excluding plurals/trailing truncations), and table-collapse (a markdown table that opens well-formed then a data row merges to a single cell, or after a good row drops its leading pipe — uniform leading-pipe omission stays safe); tuned against the real Silverton/state.db garbage AND 33 clean controls (0 FP, incl. new cb_* near-miss traps), wired into both apply_final_guards (replace with the honest note) and classify_final (armed -> DOOMED). Still DEFENSIVE ONLY — a corrupted answer becomes an honest failure, correctness needs the server-side spec-decode/fp8 rollback. v1.8.1 also adds an OPT-IN math->execute_code nudge (tools.tool_search.selfheal.math_execute_nudge, plugin default OFF and deliberately NOT seeded by install.py): on a clearly math-shaped user message (an arithmetic cue word + a multi-digit number) it appends one short cache-stable system note telling the model to run the arithmetic with execute_code rather than in-head (which drops/repeats digits on this 27B); ships OFF because the math-shape regex cannot be made reliably math-only (a year/ratio in narrative can trip a cue) and live validation was blocked by a saturated shared server — the durable defensive win is that the extended corruption/degeneracy guard now catches looped/dropped-digit math output (cl05/cl06/ms01) as an honest failure. v1.8.2 FIXES LONG-OUTPUT TAIL COLLAPSE at its source (the last goal-blocker). With ngram spec-decode permanently off, an A/B over 3 collapse-prone multi-section prompts x sampling configs (direct API, temp 0, no_think, up to 2200 max_tokens) proved the v1.5.1 frequency_penalty=0.3 injection was the CAUSE, not a cure: frequency_penalty scales with a token's running COUNT, so across a long structured answer it progressively forbids the legitimately-recurring tokens (list markers, table separators, common technical words, the EOS token itself) and derails greedy decoding into word-salad / token-fusion / synonym-avalanche exactly at the tail — freq 0.3 ran BOTH multi-item probes to the 2200 cap WITHOUT EVER STOPPING (notes tail fused into 'artificialintelligenceartificialsuperintelligence...', fs dropped f2fs and melted into 'STOP! Let me take a deep breath... maybe perhaps conceivably'), freq 0.5 derailed into off-topic narrative, and vLLM repetition_penalty=1.1 produced the worst synonym-avalanche while also suppressing natural EOS. The FIX: frequency_penalty now defaults OFF (0) and a FLAT presence_penalty=0.3 (one-shot per token, does not accumulate with count) becomes the anti-loop insurance — under it every probe completed ALL items (all 3 notes apps, all 5 filesystems incl. f2fs) and stopped naturally well under the cap, with legit structural repetition (shared platform lists, table separators) preserved and no corruption. The llm_request middleware now injects presence_penalty (tools.tool_search.presence_penalty, default 0.3, explicit 0 disables) host-gated to constrained_hosts and only when the caller didn't set it, exactly mirroring the retained-but-now-default-0 frequency_penalty; install.py seeds presence_penalty=0.3 when absent and MIGRATES the old frequency_penalty=0.3 seed to 0 in place (same in-place-tune precedent as v1.7.3's fail_wall_secs), leaving any other user-tuned value untouched. v1.8.3 (final polish) extends detect_output_corruption (tools.tool_search.corruption_guard, unchanged — NO new key) with an EMOJI/SYMBOL-SPEW collapse signal for a real Silverton run that collapsed into an emoji spew ('🔋🔋💤💥…✅✅💯💯⚡😍') slipping every prior signal: the pure emoji detector flags a dense pictographic-emoji cluster (>=6 emoji within <=2 non-emoji chars of each other), an emoji-dominated trailing window (>=5 emoji at >=50% of the tail's non-space chars), or a single non-table line that is an emoji salad (>=8 emoji at >=50% density) — it runs BEFORE the 12-char length floor (the real sample was 11 chars) and is tuned to ZERO false positives on answers that use legitimate occasional emoji (a single ✅ in a list, a lone 🎉, a per-row ✅/❌ comparison table, '🎉🎉🎉 Congrats') because math symbols (×÷√π), currency ($€£¥) and diagram arrows (→←↑↓) live in Unicode blocks deliberately EXCLUDED from the emoji classification and so can never contribute to a spew; wired identically into apply_final_guards (replace with the honest note) and classify_final (armed -> DOOMED), reason 'emoji-spew'. v1.8.3 also DOCUMENTS the INTERIM-DELIVERY GAP (README): hermes's model-narration-alongside-a-tool-call interim messages are emitted via agent._emit_interim_assistant_message (run_agent.py) -> the gateway's local _interim_assistant_cb closure (gateway/run.py) -> _status_adapter.send, a path with NO plugin hook or middleware surface (transform_llm_output fires only in turn_finalizer, the FINAL path), so the plugin CANNOT scrub/suppress a degenerate interim without site-packages edits; the fix needs an upstream hook (a transform_interim_output hook fired inside _emit_interim_assistant_message, or routing the interim callback through the transform_llm_output chain). The final-answer guard already covers the common case; this rare interim path is documented as needing-SP, not hacked. v1.8.4 (config-tune, NO plugin-code change) hard-bounds a hung streaming turn after the 2026-07-19 12-min/732s incident (session 20260719_230209): a slow/unstable shared vLLM box made ONE logical streaming call stall+reconnect for 12 min, and NO per-turn wall-clock abort exists in hermes — selfheal's fail_wall is evaluated only BETWEEN logical calls (llm_request middleware) so it cannot interrupt an in-flight call, and its forced-synthesis re-enters the same machinery. Root cause: request_timeout_seconds only sets the httpx socket READ timeout (chat_completion_helpers.py:2039-2048), which vLLM SSE keep-alive pings keep resetting, so the stale-stream detector governs — and that detector is context-scaled with a HARDCODED FLOOR (max(base,240) >50k tokens, max(base,300) >100k; chat_completion_helpers.py:2883-2889) that stale_timeout_seconds can only RAISE, never lower; the heavy 2h session floored each of 3 stream attempts (HERMES_STREAM_RETRIES=2) at ~240s → ~732s. The fix adds providers.vllm-local.stale_timeout_seconds=75 (THE per-attempt stall cap for light/compacted turns; heavy turns still floor at 150-300s), lowers tools.tool_search.selfheal.fail_wall_secs 240->150 (forced-synthesis escalates one call-boundary sooner), keeps request_timeout_seconds at 300 (only a no-byte-wedge read backstop that the 75s stale detector beats anyway; lowering it would risk cutting a legit slow prefill without helping the ping-stall), and recommends env HERMES_STREAM_RETRIES=2->1 in the gateway units (the dominant lever for heavy sessions — the only knob that shortens a ping-stall whose per-attempt floor is otherwise uncontrollable; needs a gateway restart). install.py seeds the new/changed values only-when-absent; the five deployed configs are lowered in place. Worst-case: light/compacted turns ~2-3 min ending honestly; heavy (>50k) sessions ~5-8 min (down from 12) — the 2-3 min target on heavy sessions is not reachable by config (SP stale floor is the wall), mitigated by keeping sessions compacted. See README 'Hard-bounding a hung streaming turn (v1.8.4)'. v1.8.5 (housekeeping code-review pass, NO behavior change): corrected the _fp_value() docstring (still said 'default 0.3' after v1.8.2 made frequency_penalty default 0.0 = OFF — the tested constant FREQUENCY_PENALTY_DEFAULT was already 0.0) and removed a dead unused _VOID_SKIP frozenset in web_local.py; 500 offline checks still pass, no config keys changed. v1.9.0 adds a TASK-AWARE coding / large-output accommodation (master switch tools.tool_search.coding_mode, 'auto' default | 'off') for the class of turn the tight bounds actively broke: a real telegram turn ('write a c code for quake like game', session 20260720_031846) hit the max_tokens_cap=3000 on the batch that carried the write_file call so the file's content truncated to '' (0 bytes written) and the model never emitted code, the 150s selfheal S7 wall then forced-synthesised a 'here's my plan' text before any file was written, and every follow-up ('progress?') re-planned from scratch instead of continuing (it also repeatedly offered to 'delegate to Claude Code' — a hallucinated capability: delegate_task spawns an in-process hermes subagent on the same model, there is no claude-code/codex/opencode delegation target, though the binaries happen to exist on PATH). ONLY on a detected coding turn the llm_request middleware raises the max_tokens cap to tools.tool_search.coding_max_tokens (default 8000, still clamps the 65536 provider default down so a coding runaway dies with room to write, never lowers below the base cap) and appends ONE cache-stable system note telling the model to write the code now with write_file / emit it directly instead of re-planning or re-clarifying and that it must not hand the task to Claude Code/Codex (no such delegation configured); and the selfheal S7 wall is raised to tools.tool_search.coding_wall_secs (default 360) via the host bridge so the code-writing turn isn't cut at 150s — the other selfheal sensors (S1 searches / S2 blocks / S4 blanks / S6 budget) stay unchanged so a coding turn that instead loops still bails. EVERY non-coding turn keeps 3000/150 EXACTLY. Detection (pure is_coding_turn/coding_intent, unit-tested 11/11 true positives, 0/18 false positives incl. the corpus 'Compare Python/Rust/Go/TypeScript for writing a small CLI tool, in a table' comparison, 'write a short summary', 84kg, book-a-table, count .py files): an imperative producing-verb near a concrete coding-artifact noun / 'in <language>' / '<language> program|script|function', SUPPRESSED by comparison/explanation framing (compare|vs|difference between|in a table|explain|which is best) so research/chat keep the tight bounds; plus a CONTINUATION signal so a short 'progress?'/'continue' after a coding turn with recent write_file/execute_code stays in coding mode (a vague follow-up to a pure computation turn is deliberately NOT promoted). All three keys only-when-absent (a rollback 'off' survives reinstalls); coding_mode 'off' restores exact prior behavior. Residual: a full Quake engine (3000-5000 lines) still exceeds the 27B and the 8000-token cap in one turn — bounded coding tasks (snake, dup-file finder) now complete via write_file + hermes's finish_reason=length continuation; the accommodation removes the truncate-to-empty and premature-wall failure modes, it does not make the 27B a large-codebase generator. v1.16.0 makes the reliability layer SELF-CALIBRATING via a MODEL-TIER abstraction that replaces the v1.15.0 weak-host nameplate. tools.tool_search.model_tier maps model ids / base_url hosts / provider ids to an ordered tier (weak<mid<strong), resolved per request most-specific-wins (exact model id -> model-id glob -> host -> provider -> configurable default), from the model id already present at BOTH the llm_request middleware and pre_llm_call (so a mid-session fallback_model swap re-resolves the tier); unknown -> the default (weak) fail-safe so an unclassified model is never exposed. When the key is ABSENT resolution derives EXACTLY from weak_host_guards/constrained_hosts (byte-equivalent to v1.15.0), and weak_host_guards is retained as the rollback alias (off = force weak everywhere, guards on every model, overriding model_tier). A per-guard registry (GUARD_MAX_TIER + guard_active) declares the highest tier at which each WITHHOLD/REPLACE guard fires; ADD-only guards fire at every tier. The behavioral escalation is generalized so tier sets THRESHOLDS, never a hard on/off: (W1) detect_output_corruption now returns the signal SET and a full WITHHOLD is authorized only when CORROBORATED (>=2 corruption sub-signals, or 1 + a repetition/degeneracy signal) — on a gateway the reversible bounded auto-retry (corrupt_retries) runs first, and a LONE uncorroborated signal is DELIVERED WITH AN INLINE CAVEAT instead of withheld, retiring the batch4-r09 single-suspicion false-withhold class on ALL tiers; (W2) the selfheal FAILING ladder is tier-scaled (weak x1 = v1.15.0 single-sensor; strong x3 + needs >=2 sensors or one extreme) rather than hard-off, so a genuinely looping strong model is still caught while a well-behaved one is transparent; (W12) the topics resumption-context injection is signal-gated on strong (continuation + entity overlap over tools.tool_search.topics.inject_overlap_strong, default 0.6) so a trivial one-off frontier prompt is never derailed while a genuine resume still injects, and weak/mid keep the always-inject path; (W9) the repetition-collapse FULL-REPLACE branch corroborates (>=2 signals) before withholding, else delivers the short clean prefix with a caveat, while the reversible truncate/salvage path is unchanged. install.py seeds tools.tool_search.model_tier: {deepseek-v4-pro: strong, default: weak} only-when-absent (equivalence-preserving on the current fleet: the frontier root model sheds the 27B-only correctness guards, every unlisted/vLLM model stays weak with full protection); onboarding a new model is one config line. Offline suites stay green and behavior is byte-equivalent to v1.15.0 with model_tier absent (the equivalence proof for the tier resolver + guard registry + config parse being pure refactors). v1.17.0 adds ANTI-FABRICATION (claim-grounding), targeting the residual confident-fabrication on research turns — the model searches heavily and ~95% of specifics are grounded, but presents SELF-COMPUTED roll-up aggregates (summed commit/PR totals, invented counts) as if sourced. B (plugin/antifab.py, tools.tool_search.antifab, default on): a post-draft numeric claim-grounding annotate composed into the transform_llm_output finisher — it fetches the turn's retrieved WEB corpus (web_search/web_extract tool results only), extracts the high-risk numeric specifics from the finished answer (magnitudes >=1000, percentages, $ amounts, multipliers, arxiv ids, keyword-adjacent counts; bare small ints skipped), and APPENDS an 'unverified figures' caveat naming only the specifics not matched to the corpus. Matching is aggressively normalized (thousands commas, percent/×, K/M/B scale forms, and a 1% precision tolerance so 1.45 billion == 1,450,000,000) and biased to under-flag — a false caveat on a grounded number is the failure mode avoided. It NEVER deletes/rewrites the body (add-vs-withhold safe), runs only on the healthy-answer path, self-gates to web-research turns (skips computation-request turns and non-web tool corpora), treats user-supplied figures as grounded, is idempotent, ADD-only (guard ceiling strong -> fires on BOTH tiers), $0 marginal (no extra API call), and fully fail-safe. A (verify_route.apply_grounding_directive, tools.tool_search.ground_directive, default on): an un-host-gated ~60-token pre-draft grounding directive on research turns steering the model off roll-up totals and rumored/upcoming items presented as sourced. C (tools.tool_search.verify_pass, default OFF): an optional strong-tier-only skeptic second-pass LLM verifier, gated on B having flagged >= verify_pass_min specifics, never on the weak profiles. install.py seeds antifab/ground_directive on and verify_pass off only-when-absent. v1.18.0 adds a clarify guard (verify_route.apply_clarify_guard, tools.tool_search.clarify_guard, default on): an ADD-ONLY, un-host-gated (tier-agnostic) pre-turn directive appended by the same _antifab_middleware on a first-call turn with NO prior in-conversation context whose user message is genuinely ambiguous with no concrete referent (a bare deictic/continuation imperative like 'Fix it.'/'continue'/'do that now', or a reference to vague prior context like 'finish the thing we discussed'/'what we talked about'). It nudges the model to ask ONE clarifying question instead of guessing or spelunking session history and over-executing (the observed corpus clarify_or_honesty/adversarial_edge failure). ~35 tokens, no extra API call, appended once, never withholds/rewrites an answer and names no specific tool. The detector is conservative and biased to silence (a CLEAR short prompt — 'list my todos', 'convert 84 kg to pounds', 'add a todo: buy milk' — never trips it: Family A is anchored to the whole prompt so any concrete object fails the match, Family B requires an explicit vague-prior-context phrase); the no-prior-context gate keeps it quiet in genuine multi-turn continuations. 'off' is the one-key rollback; install.py seeds it on only-when-absent. v1.19.0 adds two ADD-ONLY, fail-safe pre_tool_call gates that make the clarify_guard nudge BIND and stop a hung turn: (1) clarify-finalize (tools.tool_search.clarify_finalize, default on) — ONLY on a turn clarify_guard flagged AND once the model actually invokes the clarify tool, the turn is finalized: the (blocking/interactive) clarify call is intercepted, the model is told to emit its clarifying question as the final answer, and every further tool call that turn is blocked, so the model can no longer spelunk session history and over-execute (never touches a clear prompt or a normal multi-tool turn — the guard's 0-false-positive property is preserved; tier-agnostic); (2) a tier-INDEPENDENT runaway wall (tools.tool_search.runaway_wall, default on; runaway_call_cap default 50, runaway_wall_secs default 480) — past a conservatively high per-turn tool-call count or wall-clock, further tool calls are blocked and the model is steered to finalize honestly, so a runaway hung loop that no tier-scaled escalation caught ends as an honest failure instead of a hard external timeout, with thresholds set well above any legitimate long-research turn."
